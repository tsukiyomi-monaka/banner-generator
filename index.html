<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バナーデザイン候補生成ツール</title>
  <style>
    /* ========== リセット & ベース ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand:   #5B6EF5;
      --brand-d: #4455d4;
      --brand-l: #eef0ff;
      --gray-50: #f8f9fa;
      --gray-100:#f1f3f5;
      --gray-200:#e9ecef;
      --gray-300:#dee2e6;
      --gray-400:#ced4da;
      --gray-500:#adb5bd;
      --gray-600:#868e96;
      --gray-700:#495057;
      --gray-800:#343a40;
      --gray-900:#212529;
      --red:     #e03131;
      --green:   #2f9e44;
      --radius:  8px;
      --shadow:  0 2px 8px rgba(0,0,0,.10);
      --shadow-lg: 0 4px 20px rgba(0,0,0,.13);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
                   "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
      min-height: 100vh;
    }

    /* ========== ヘッダー ========== */
    header {
      background: #fff;
      border-bottom: 1px solid var(--gray-200);
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .logo-icon {
      width: 32px; height: 32px;
      background: var(--brand);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 16px; font-weight: 700; flex-shrink: 0;
    }
    header h1 { font-size: 17px; font-weight: 700; color: var(--gray-900); }
    header span.sub { font-size: 12px; color: var(--gray-500); margin-left: 4px; }

    /* ========== レイアウト ========== */
    .container {
      max-width: 1160px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ========== カード ========== */
    .card {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 28px 32px;
      box-shadow: var(--shadow);
    }
    .card + .card { margin-top: 20px; }
    .card-title {
      font-size: 15px; font-weight: 700;
      color: var(--gray-800);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--gray-100);
      display: flex; align-items: center; gap: 8px;
    }
    .card-title .step-badge {
      background: var(--brand);
      color: #fff;
      font-size: 11px; font-weight: 700;
      padding: 2px 8px;
      border-radius: 100px;
    }

    /* ========== フォーム ========== */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 28px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 600; color: var(--gray-700); }
    label .req { color: var(--red); margin-left: 2px; font-weight: 700; }
    label .opt { color: var(--gray-500); font-weight: 400; font-size: 12px; margin-left: 4px; }
    input[type="text"],
    textarea {
      border: 1px solid var(--gray-300);
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--gray-900);
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
      outline: none;
      width: 100%;
    }
    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(91,110,245,.15);
    }
    textarea { resize: vertical; min-height: 64px; }

    /* ========== 画像アップロード ========== */
    .upload-area {
      border: 2px dashed var(--gray-300);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      position: relative;
    }
    .upload-area:hover { border-color: var(--brand); background: var(--brand-l); }
    .upload-area.has-image { border-style: solid; border-color: var(--brand); }
    .upload-area input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .upload-area .upload-icon { font-size: 28px; margin-bottom: 6px; }
    .upload-area .upload-text { font-size: 13px; color: var(--gray-600); }
    .upload-area .upload-text strong { color: var(--brand); }
    .upload-preview {
      max-height: 100px;
      max-width: 100%;
      border-radius: 4px;
      margin-bottom: 6px;
      display: none;
    }
    .upload-remove {
      background: none; border: none;
      font-size: 12px; color: var(--red);
      cursor: pointer; text-decoration: underline;
      position: relative; z-index: 10;
    }

    /* ========== ラジオ / チェックボックス ========== */
    .radio-group, .checkbox-group {
      display: flex; flex-wrap: wrap; gap: 10px;
    }
    .tone-radio label {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 16px;
      border: 1.5px solid var(--gray-300);
      border-radius: 100px;
      cursor: pointer; font-size: 13px; font-weight: 500;
      color: var(--gray-700);
      transition: border-color .15s, background .15s, color .15s;
      user-select: none;
    }
    .tone-radio input { display: none; }
    .tone-radio input:checked + label {
      border-color: var(--brand);
      background: var(--brand-l);
      color: var(--brand);
    }

    .size-check label {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 14px;
      border: 1.5px solid var(--gray-300);
      border-radius: 6px;
      cursor: pointer; font-size: 13px;
      transition: border-color .15s, background .15s;
      user-select: none;
    }
    .size-check input { display: none; }
    .size-check input:checked + label {
      border-color: var(--brand);
      background: var(--brand-l);
    }
    .size-check .size-name { font-weight: 600; color: var(--gray-800); }
    .size-check .size-desc { font-size: 11px; color: var(--gray-500); }

    /* ========== 生成ボタン ========== */
    .btn-generate {
      width: 100%;
      padding: 14px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 28px;
    }
    .btn-generate:hover:not(:disabled) { background: var(--brand-d); }
    .btn-generate:active:not(:disabled) { transform: scale(.99); }
    .btn-generate:disabled { opacity: .6; cursor: not-allowed; }

    /* ========== エラーバナー ========== */
    .error-box {
      display: none;
      background: #fff5f5;
      border: 1.5px solid #ffc9c9;
      border-radius: var(--radius);
      padding: 14px 18px;
      color: var(--red);
      font-size: 13px;
      line-height: 1.6;
      margin-top: 16px;
    }
    .error-box.visible { display: flex; gap: 10px; align-items: flex-start; }
    .error-icon { font-size: 16px; flex-shrink: 0; }

    /* ========== ローディング ========== */
    .loading-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(255,255,255,.85);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .loading-overlay.visible { display: flex; }
    .spinner {
      width: 48px; height: 48px;
      border: 5px solid var(--gray-200);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 15px; color: var(--gray-700); font-weight: 600; }
    .loading-sub  { font-size: 12px; color: var(--gray-500); }

    /* ========== 出力セクション ========== */
    #output-section { display: none; }
    #output-section.visible { display: block; }

    /* ========== メインタブ（プレビュー / プロンプト） ========== */
    .main-tabs {
      display: flex; gap: 0;
      border-bottom: 2px solid var(--gray-200);
      margin-bottom: 24px;
    }
    .main-tab-btn {
      padding: 10px 24px;
      background: none; border: none;
      font-size: 14px; font-weight: 600;
      color: var(--gray-500);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color .15s, border-color .15s;
    }
    .main-tab-btn.active { color: var(--brand); border-bottom-color: var(--brand); }

    /* ========== デザイン案タブ（A〜D） ========== */
    .design-tabs {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .design-tab-btn {
      padding: 7px 18px;
      background: var(--gray-100);
      border: 1.5px solid var(--gray-200);
      border-radius: 6px;
      font-size: 13px; font-weight: 600;
      color: var(--gray-600);
      cursor: pointer;
      transition: all .15s;
    }
    .design-tab-btn.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }
    .design-tab-btn:hover:not(.active) {
      background: var(--brand-l);
      border-color: var(--brand);
      color: var(--brand);
    }

    /* ========== サイズタブ ========== */
    .size-tabs {
      display: flex; gap: 6px; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .size-tab-btn {
      padding: 5px 14px;
      background: none;
      border: 1.5px solid var(--gray-300);
      border-radius: 100px;
      font-size: 12px; font-weight: 600;
      color: var(--gray-600);
      cursor: pointer;
      transition: all .15s;
    }
    .size-tab-btn.active {
      background: var(--gray-800);
      border-color: var(--gray-800);
      color: #fff;
    }

    /* ========== バナープレビュー ========== */
    .preview-wrapper {
      background: var(--gray-100);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 24px;
      overflow: auto;
    }
    .banner-frame-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 200px;
    }
    .banner-scale-wrap {
      transform-origin: top center;
      transition: transform .2s;
    }
    .banner-iframe {
      display: block;
      border: none;
      background: #fff;
      box-shadow: var(--shadow-lg);
    }
    .scale-note {
      text-align: center;
      font-size: 11px;
      color: var(--gray-500);
      margin-top: 10px;
    }

    /* ========== デザイン情報 ========== */
    .design-meta {
      margin-top: 20px;
      padding: 16px 20px;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 24px;
    }
    .meta-item label {
      font-size: 11px; font-weight: 700;
      color: var(--gray-500);
      text-transform: uppercase; letter-spacing: .5px;
    }
    .meta-item .value { font-size: 13px; color: var(--gray-800); margin-top: 3px; }
    .color-swatches { display: flex; gap: 6px; margin-top: 4px; }
    .swatch {
      width: 22px; height: 22px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,.12);
      cursor: default;
      position: relative;
    }
    .swatch:hover::after {
      content: attr(data-color);
      position: absolute;
      bottom: 28px; left: 50%;
      transform: translateX(-50%);
      background: var(--gray-900);
      color: #fff;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
    }

    /* ========== コピーボタン ========== */
    .copy-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .btn-copy {
      padding: 8px 18px;
      background: #fff;
      border: 1.5px solid var(--brand);
      border-radius: 6px;
      font-size: 13px; font-weight: 600;
      color: var(--brand);
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: background .15s, color .15s;
    }
    .btn-copy:hover { background: var(--brand); color: #fff; }
    .btn-copy.copied {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    /* ========== プロンプトタブ ========== */
    .prompt-cards { display: flex; flex-direction: column; gap: 20px; }
    .prompt-card {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .prompt-card-header {
      padding: 12px 18px;
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
      display: flex; align-items: center; justify-content: space-between;
    }
    .prompt-card-header h3 {
      font-size: 14px; font-weight: 700;
      color: var(--gray-800);
    }
    .prompt-text {
      padding: 16px 18px;
      font-size: 13px; line-height: 1.7;
      color: var(--gray-700);
      background: #fafbff;
      font-family: "Menlo", "Monaco", "Consolas", monospace;
      word-break: break-all;
      white-space: pre-wrap;
    }
    .prompt-copy-row {
      padding: 10px 18px;
      display: flex; justify-content: flex-end;
      border-top: 1px solid var(--gray-200);
    }

    /* ========== 区切り ========== */
    .section-sep { height: 1px; background: var(--gray-200); margin: 28px 0; }
  </style>
</head>
<body>

<!-- ===== ヘッダー ===== -->
<header>
  <div class="logo-icon">B</div>
  <h1>バナーデザイン候補生成ツール <span class="sub">Powered by Claude</span></h1>
</header>

<!-- ===== ローディングオーバーレイ ===== -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">デザイン案を生成中...</div>
  <div class="loading-sub">A〜D案 × 各サイズのHTML/CSSを生成しています。30〜60秒ほどお待ちください。</div>
</div>

<div class="container">

  <!-- ===== 入力フォーム ===== -->
  <div class="card">
    <div class="card-title">
      <span class="step-badge">STEP 1</span>
      バナー情報を入力
    </div>

    <form id="bannerForm">

      <!-- 商品画像 -->
      <div class="form-group full" style="margin-bottom:4px;">
        <label>商品画像 <span class="opt">（任意）</span></label>
        <div class="upload-area" id="uploadArea">
          <input type="file" id="imageInput" accept="image/*">
          <img id="uploadPreview" class="upload-preview" alt="プレビュー">
          <div id="uploadPlaceholder">
            <div class="upload-icon">🖼️</div>
            <div class="upload-text">クリックして画像を選択<br><strong>PNG / JPG / GIF / WebP</strong> 対応</div>
          </div>
          <button type="button" class="upload-remove" id="removeImage" style="display:none;">✕ 画像を削除</button>
        </div>
      </div>

      <div class="form-grid">
        <!-- キャッチコピー -->
        <div class="form-group">
          <label>キャッチコピー <span class="req">*</span></label>
          <input type="text" id="catchcopy" placeholder="例：肌に溶け込む、至福のうるおい" required>
        </div>
        <!-- CTA -->
        <div class="form-group">
          <label>CTA文言 <span class="opt">（任意）</span></label>
          <input type="text" id="cta" placeholder="例：今すぐ購入、無料で試す">
        </div>
        <!-- サブテキスト -->
        <div class="form-group full">
          <label>サブテキスト <span class="opt">（任意）</span></label>
          <textarea id="subtext" placeholder="例：厳選された天然成分配合。毎日のスキンケアに。"></textarea>
        </div>
      </div>

      <div class="section-sep"></div>

      <!-- トーン -->
      <div class="form-group full">
        <label>トーン <span class="req">*</span></label>
        <div class="radio-group" id="toneGroup"></div>
      </div>

      <div class="section-sep"></div>

      <!-- バナーサイズ -->
      <div class="form-group full">
        <label>バナーサイズ <span class="req">*</span>（複数選択可）</label>
        <div class="checkbox-group" id="sizeGroup"></div>
      </div>

      <!-- エラー表示 -->
      <div class="error-box" id="errorBox">
        <span class="error-icon">⚠️</span>
        <span id="errorMsg"></span>
      </div>

      <!-- 生成ボタン -->
      <button type="submit" class="btn-generate" id="generateBtn">
        ✨ デザイン案を生成（A〜D案）
      </button>

    </form>
  </div>

  <!-- ===== 出力セクション ===== -->
  <div id="output-section">
    <div class="card" style="margin-top:28px;">
      <div class="card-title">
        <span class="step-badge">STEP 2</span>
        生成されたデザイン案
      </div>

      <!-- メインタブ -->
      <div class="main-tabs">
        <button class="main-tab-btn active" data-main-tab="preview">🖼️ プレビュー</button>
        <button class="main-tab-btn" data-main-tab="prompts">📝 Gemini ImageFXプロンプト</button>
      </div>

      <!-- プレビュータブコンテンツ -->
      <div id="tab-preview">
        <!-- デザイン案タブ（A〜D） -->
        <div class="design-tabs" id="designTabs"></div>
        <!-- サイズタブ -->
        <div class="size-tabs" id="sizeTabs"></div>
        <!-- バナー表示エリア -->
        <div class="preview-wrapper">
          <div class="banner-frame-container">
            <div class="banner-scale-wrap" id="bannerScaleWrap">
              <iframe class="banner-iframe" id="bannerIframe" scrolling="no"></iframe>
            </div>
          </div>
          <div class="scale-note" id="scaleNote"></div>
        </div>
        <!-- デザイン情報 -->
        <div class="design-meta" id="designMeta"></div>
        <!-- コピーボタン -->
        <div class="copy-row">
          <button class="btn-copy" id="copyDesignBtn">
            📋 このデザインのHTML/CSSをコピー
          </button>
        </div>
      </div>

      <!-- プロンプトタブコンテンツ -->
      <div id="tab-prompts" style="display:none;">
        <div class="prompt-cards" id="promptCards"></div>
      </div>

    </div>
  </div>

</div>

<!-- ===== スクリプト読み込み ===== -->
<script src="config.js"></script>
<script src="prompts/templates.js"></script>
<script>
/* =========================================================
   メインアプリケーションロジック
   ========================================================= */

// ---------- 状態管理 ----------
const state = {
  imageBase64: null,       // アップロード済み画像のDataURL
  designs: [],             // 生成された4案データ
  activeDesign: 'A',       // 現在選択中のデザイン案
  activeSize: null,        // 現在選択中のサイズID
  selectedSizes: [],       // 選択されたサイズオブジェクト配列
};

// ---------- DOM要素キャッシュ ----------
const $ = id => document.getElementById(id);
const form           = $('bannerForm');
const catchcopyEl    = $('catchcopy');
const subtextEl      = $('subtext');
const ctaEl          = $('cta');
const imageInput     = $('imageInput');
const uploadPreview  = $('uploadPreview');
const uploadArea     = $('uploadArea');
const uploadPlaceholder = $('uploadPlaceholder');
const removeImageBtn = $('removeImage');
const toneGroup      = $('toneGroup');
const sizeGroup      = $('sizeGroup');
const errorBox       = $('errorBox');
const errorMsg       = $('errorMsg');
const loadingOverlay = $('loadingOverlay');
const outputSection  = $('output-section');
const generateBtn    = $('generateBtn');
const designTabs     = $('designTabs');
const sizeTabs       = $('sizeTabs');
const bannerIframe   = $('bannerIframe');
const bannerScaleWrap= $('bannerScaleWrap');
const scaleNote      = $('scaleNote');
const designMeta     = $('designMeta');
const copyDesignBtn  = $('copyDesignBtn');
const promptCards    = $('promptCards');
const tabPreview     = $('tab-preview');
const tabPrompts     = $('tab-prompts');

// ---------- 初期化：トーン・サイズUI構築 ----------
function initUI() {
  // トーンラジオボタン
  TONES.forEach((tone, i) => {
    const wrapper = document.createElement('div');
    wrapper.className = 'tone-radio';
    wrapper.innerHTML = `
      <input type="radio" name="tone" id="tone_${tone.id}" value="${tone.id}" ${i === 0 ? 'checked' : ''}>
      <label for="tone_${tone.id}">${tone.label}</label>
    `;
    toneGroup.appendChild(wrapper);
  });

  // サイズチェックボックス
  BANNER_SIZES.forEach((size, i) => {
    const wrapper = document.createElement('div');
    wrapper.className = 'size-check';
    wrapper.innerHTML = `
      <input type="checkbox" id="size_${size.id}" value="${size.id}" ${i === 0 ? 'checked' : ''}>
      <label for="size_${size.id}">
        <span class="size-name">${size.label}</span>
        <span class="size-desc">${size.desc}</span>
      </label>
    `;
    sizeGroup.appendChild(wrapper);
  });
}

// ---------- 画像アップロード ----------
imageInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    state.imageBase64 = ev.target.result;
    uploadPreview.src = ev.target.result;
    uploadPreview.style.display = 'block';
    uploadPlaceholder.style.display = 'none';
    removeImageBtn.style.display = 'inline';
    uploadArea.classList.add('has-image');
  };
  reader.readAsDataURL(file);
});

removeImageBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  state.imageBase64 = null;
  imageInput.value = '';
  uploadPreview.style.display = 'none';
  uploadPreview.src = '';
  uploadPlaceholder.style.display = 'block';
  removeImageBtn.style.display = 'none';
  uploadArea.classList.remove('has-image');
});

// ---------- エラー表示・非表示 ----------
function showError(msg) {
  errorMsg.textContent = msg;
  errorBox.classList.add('visible');
}
function clearError() {
  errorBox.classList.remove('visible');
}

// ---------- バリデーション ----------
function validate() {
  if (!ANTHROPIC_API_KEY || ANTHROPIC_API_KEY === 'ここにAPIキーを貼り付けてください') {
    showError('config.js にAnthropicのAPIキーが設定されていません。config.js を開いて ANTHROPIC_API_KEY を設定してください。');
    return false;
  }
  if (!catchcopyEl.value.trim()) {
    showError('キャッチコピーは必須です。');
    catchcopyEl.focus();
    return false;
  }
  const checkedSizes = [...document.querySelectorAll('#sizeGroup input:checked')];
  if (checkedSizes.length === 0) {
    showError('バナーサイズを1つ以上選択してください。');
    return false;
  }
  return true;
}

// ---------- フォーム送信 ----------
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();
  if (!validate()) return;

  // 選択サイズ収集
  const checkedSizeIds = [...document.querySelectorAll('#sizeGroup input:checked')].map(el => el.value);
  state.selectedSizes = BANNER_SIZES.filter(s => checkedSizeIds.includes(s.id));

  // 選択トーン
  const toneId = document.querySelector('input[name="tone"]:checked').value;
  const tone = TONES.find(t => t.id === toneId);

  setLoading(true);
  try {
    const result = await callClaudeAPI({
      catchcopy: catchcopyEl.value.trim(),
      subtext: subtextEl.value.trim(),
      cta: ctaEl.value.trim() || '詳しくはこちら',
      tone,
      selectedSizes: state.selectedSizes,
      imageBase64: state.imageBase64,
    });
    state.designs = result.designs;
    renderOutput();
  } catch (err) {
    showError(err.message || '予期しないエラーが発生しました。');
  } finally {
    setLoading(false);
  }
});

// ---------- ローディング ----------
function setLoading(on) {
  loadingOverlay.classList.toggle('visible', on);
  generateBtn.disabled = on;
}

// ---------- Claude API呼び出し ----------
async function callClaudeAPI({ catchcopy, subtext, cta, tone, selectedSizes, imageBase64 }) {
  const userPromptText = buildUserPrompt({
    catchcopy, subtext, cta,
    toneLabel: tone.label,
    toneKeywords: tone.keywords,
    toneColorHint: tone.colorHint,
    selectedSizes,
    imageBase64,
  });

  // メッセージ組み立て（画像がある場合はvision形式）
  let userContent;
  if (imageBase64) {
    // base64部分とメディアタイプを抽出
    const match = imageBase64.match(/^data:([^;]+);base64,(.+)$/);
    if (match) {
      userContent = [
        {
          type: 'image',
          source: {
            type: 'base64',
            media_type: match[1],
            data: match[2],
          }
        },
        { type: 'text', text: userPromptText }
      ];
    } else {
      userContent = userPromptText;
    }
  } else {
    userContent = userPromptText;
  }

  const payload = {
    model: CLAUDE_MODEL,
    max_tokens: 8192,
    system: SYSTEM_PROMPT,
    messages: [
      { role: 'user', content: userContent }
    ]
  };

  let response;
  try {
    response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': ANTHROPIC_API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify(payload),
    });
  } catch (err) {
    throw new Error('APIへの接続に失敗しました。インターネット接続とAPIキーを確認してください。\n詳細: ' + err.message);
  }

  if (!response.ok) {
    let errDetail = '';
    try { const j = await response.json(); errDetail = j.error?.message || JSON.stringify(j); } catch {}
    if (response.status === 401) throw new Error('APIキーが無効です。config.js のキーを確認してください。\n詳細: ' + errDetail);
    if (response.status === 429) throw new Error('APIのレート制限に達しました。しばらく待ってから再試行してください。');
    throw new Error(`APIエラー (${response.status}): ${errDetail}`);
  }

  const data = await response.json();
  const rawText = data.content?.[0]?.text || '';

  // JSON抽出（```json ... ``` をケア）
  let jsonStr = rawText.trim();
  const fenceMatch = jsonStr.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fenceMatch) jsonStr = fenceMatch[1].trim();

  let parsed;
  try {
    parsed = JSON.parse(jsonStr);
  } catch (e) {
    // 部分的にでもJSONを取り出す試み
    const start = jsonStr.indexOf('{');
    const end = jsonStr.lastIndexOf('}');
    if (start !== -1 && end !== -1) {
      try { parsed = JSON.parse(jsonStr.slice(start, end + 1)); } catch {}
    }
    if (!parsed) throw new Error('APIからの応答をJSON解析できませんでした。もう一度試してください。\n応答: ' + rawText.slice(0, 200));
  }

  if (!parsed.designs || !Array.isArray(parsed.designs) || parsed.designs.length === 0) {
    throw new Error('デザイン案データが見つかりませんでした。再生成してください。');
  }
  return parsed;
}

// ---------- 出力レンダリング ----------
function renderOutput() {
  state.activeDesign = state.designs[0]?.id || 'A';
  state.activeSize = state.selectedSizes[0]?.id || null;

  // デザインタブ構築
  designTabs.innerHTML = '';
  state.designs.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'design-tab-btn' + (d.id === state.activeDesign ? ' active' : '');
    btn.textContent = `${d.id}案：${d.name}`;
    btn.dataset.design = d.id;
    btn.addEventListener('click', () => switchDesign(d.id));
    designTabs.appendChild(btn);
  });

  // サイズタブ構築
  sizeTabs.innerHTML = '';
  state.selectedSizes.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'size-tab-btn' + (s.id === state.activeSize ? ' active' : '');
    btn.textContent = `${s.label}（${s.desc}）`;
    btn.dataset.sizeId = s.id;
    btn.addEventListener('click', () => switchSize(s.id));
    sizeTabs.appendChild(btn);
  });

  // プロンプトカード構築
  promptCards.innerHTML = '';
  state.designs.forEach(d => {
    const card = document.createElement('div');
    card.className = 'prompt-card';
    card.innerHTML = `
      <div class="prompt-card-header">
        <h3>${d.id}案：${d.name}</h3>
      </div>
      <div class="prompt-text">${escHtml(d.imagefxPrompt || '')}</div>
      <div class="prompt-copy-row">
        <button class="btn-copy" data-prompt="${d.id}">📋 プロンプトをコピー</button>
      </div>
    `;
    card.querySelector('.btn-copy').addEventListener('click', (e) => {
      copyToClipboard(d.imagefxPrompt || '', e.currentTarget);
    });
    promptCards.appendChild(card);
  });

  renderBanner();
  renderDesignMeta();

  outputSection.classList.add('visible');
  outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---------- デザイン・サイズ切り替え ----------
function switchDesign(id) {
  state.activeDesign = id;
  document.querySelectorAll('.design-tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.design === id);
  });
  renderBanner();
  renderDesignMeta();
}
function switchSize(id) {
  state.activeSize = id;
  document.querySelectorAll('.size-tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.sizeId === id);
  });
  renderBanner();
}

// ---------- バナーiframe描画 ----------
function renderBanner() {
  const design = state.designs.find(d => d.id === state.activeDesign);
  if (!design || !state.activeSize) return;

  const html = design.sizes?.[state.activeSize] || '<div style="padding:20px;color:#999;">このサイズのデザインが見つかりません</div>';
  const sizeObj = state.selectedSizes.find(s => s.id === state.activeSize);

  const w = sizeObj?.width  || 300;
  const h = sizeObj?.height || 250;

  bannerIframe.width  = w;
  bannerIframe.height = h;
  bannerIframe.style.width  = w + 'px';
  bannerIframe.style.height = h + 'px';

  // スケーリング：最大幅 860px に収める
  const maxW = 860;
  const scale = w > maxW ? maxW / w : 1;
  bannerScaleWrap.style.transform = `scale(${scale})`;
  bannerScaleWrap.style.width  = w + 'px';
  bannerScaleWrap.style.height = h + 'px';
  bannerScaleWrap.parentElement.style.height = Math.ceil(h * scale) + 'px';

  scaleNote.textContent = scale < 1
    ? `表示スケール: ${Math.round(scale * 100)}%（実寸 ${w}×${h}px）`
    : `実寸表示: ${w}×${h}px`;

  // iframeにHTMLを書き込む
  const doc = bannerIframe.contentDocument || bannerIframe.contentWindow.document;
  doc.open();
  doc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>*{margin:0;padding:0;box-sizing:border-box;}body{overflow:hidden;}</style></head><body>${html}</body></html>`);
  doc.close();
}

// ---------- デザイン情報メタ表示 ----------
function renderDesignMeta() {
  const design = state.designs.find(d => d.id === state.activeDesign);
  if (!design) return;
  const cp = design.colorPalette || {};
  const colors = [cp.background, cp.primary, cp.secondary, cp.accent, cp.text].filter(Boolean);

  designMeta.innerHTML = `
    <div class="meta-item">
      <label>コンセプト</label>
      <div class="value">${escHtml(design.concept || '')}</div>
    </div>
    <div class="meta-item">
      <label>レイアウト</label>
      <div class="value">${escHtml(design.layout || '')}</div>
    </div>
    <div class="meta-item">
      <label>カラーパレット</label>
      <div class="color-swatches">
        ${colors.map(c => `<div class="swatch" style="background:${c}" title="${c}" data-color="${c}"></div>`).join('')}
      </div>
    </div>
    <div class="meta-item">
      <label>タイポグラフィ方針</label>
      <div class="value">${escHtml((design.typography?.headline || '') + ' / ' + (design.typography?.cta || ''))}</div>
    </div>
  `;
}

// ---------- HTML/CSSコピー ----------
copyDesignBtn.addEventListener('click', () => {
  const design = state.designs.find(d => d.id === state.activeDesign);
  if (!design || !state.activeSize) return;
  const html = design.sizes?.[state.activeSize] || '';
  copyToClipboard(html, copyDesignBtn);
});

// ---------- クリップボードコピー共通 ----------
function copyToClipboard(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML = '✅ コピーしました！';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = orig;
    }, 2000);
  }).catch(() => {
    // フォールバック
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const orig = btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML = '✅ コピーしました！';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = orig;
    }, 2000);
  });
}

// ---------- メインタブ切り替え ----------
document.querySelectorAll('.main-tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.mainTab;
    tabPreview.style.display = tab === 'preview' ? 'block' : 'none';
    tabPrompts.style.display = tab === 'prompts' ? 'block' : 'none';
  });
});

// ---------- ユーティリティ ----------
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ---------- 起動 ----------
initUI();
</script>
